<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        :root{
            --white-color : white;
            --blue-color : blue
        }
        body{
            background-color: grey;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
              display: flex;
            justify-content: center;
            align-items: center;
       
        }
        #circle{
            height: 30rem;
            width: 30rem;
            border-radius: 100%;
            background-color: blue;
          display: flex;
            justify-content: center;
            align-items: center;
        }

        #circletwo{
            height: 20rem;
            width: 20rem;
            border-radius: 100%;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #third{
             height: 5rem;
            width: 5rem;
            border-radius: 100%;
            background-color: var(--white-color);
            
        }
    
    </style>
</head>
<body>
    <div id="circle">
       
        <div id="circletwo" >
          
            <div id="third"></div>
        </div>

        
    </div>
</body>
</html>
