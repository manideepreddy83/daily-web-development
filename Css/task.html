<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            height: 100vh;
           
            margin:0%;
            background-color: aliceblue;
            
        }
        #continer{
            display: flex;
            height: 100%;
            width: 100%;
           padding: 1%;
            gap: 20px;
        }
        #navbar{
            height : 100%;
            width : 20%;
            background-color: aqua;
            display: flex;
            flex-direction: column;
            gap:20px;
            align-items: center;
            
        }
        .user{
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-bottom: 1px solid black;
            
        }
        .circle{
            height:80px;
            width: 80px;
            border-radius: 50px;
            border:1px solid black;
            background-color: azure;
            
        }
        #main{
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            padding: 10px;
        }
        .card{
            width:calc((100% - 40px) / 3);
            height: 100px;  
            background-color: white;
            border:1px solid black;
            border-radius: 12px;
            
        }
       
    </style>
</head>
<body>
    <div id="continer">

        <div id="navbar">
            <div class="user">
                <div class="circle" style="background-color: aquamarine;"></div>
                    <p>user 1</p>

                    </div>

            <div class="user">
                <div class="circle" style="background-color: blanchedalmond;"></div>
                    <p>user 1</p>
                        </div>    
                    </div>
           <div id="main">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
           </div>         
 
    </div>
</body>
</html>
