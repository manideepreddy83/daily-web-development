
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        height:100vh;
         width: 100vw;
         margin: 0;
         padding: 0%;
         display: flex;
         justify-content: center;
         align-items: center;
    }

    #continer{
        border: 1px solid black;
        height:80%;
        width:80%;
        display: grid;
        grid-template-columns: 200px repeat(2,1fr);
        grid-template-rows: 1fr 1fr 1fr;
        row-gap: 10px;
        column-gap: 20px;
    }

    .box{
        /* height: 100px;
        width : 100px; */
        border :1px solid blue;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .box1{
        grid-column: 1/3;
    }
    .box4{
       
        grid-row: 2/4;
    }
    @media (max-width:600px) {
        #continer{
            grid-template-columns: 1fr;
            /* background-color: black; */
        }
    }
    </style>
</head>
<body>
    <div id="continer">
        <div class="box box1">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box box4">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>

            
    </div>

</body>
</html>
