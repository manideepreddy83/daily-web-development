<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            width: 100vw;
            margin: 0%;
            padding: 0%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

         .box{
            height: 100px;
            width:200px;
            border: 1px solid black;
            overflow: auto;
            gap:10px;
            padding: 10px;
            transition: transform 1s ease 0.5s;
         }
         .box:hover{
            transform: translate(50px,50px);
            transform: rotate(360deg);
            transform: skew(-50deg);
            
         }
         
    </style>
</head>
<body>
  <div class="box">
      <p>first</p>
      <p>second</p>
      <p>third</p>
      <p>fourth</p>
      <p>five</p>
  </div>
</body>
</html>
