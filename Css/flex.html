
<!-- flex-direction -->
<!-- flex-wrap -->
 <!-- flex-flow is combined of flex-direction and flex-wrap -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Flex intro</title>
    <style>
          body{
            background-color: whitesmoke;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0%;
          }
          #flex{
            height: 40px;
            width: 100%;
            background-color: #2196f3;
            display: flex;
            justify-content: space-between;
            
          }
          .left{
            height: 100%;
            width: 90%;
            display: flex;
            align-items: center;
            gap : 20px;
            
          }
          .right{
            height: 100%;
            width: 10%;
           display:flex;
          align-items: center;
           justify-content: center;
               
          }

          a{
            color: white;
            text-decoration: none;
          }
          #mainbox{
            border: 1px solid black;
            height: 500px;
            width: 1000px;
            display: flex;
            /* flex-direction: column; */
            /* align-items: center; */
            justify-content: space-between;
            flex-direction: row-reverse;
            flex-wrap: wrap;
          }
          
          .box{
            flex-grow: 1;
            border: 1px solid black;
            height: 50px;
            /* width:400px; */
            font: xx-large;
            display: flex;
            justify-content: center;
            align-items: center;
          }

          #flexgrow{
            flex-grow: 2;
            flex-wrap: wrap;
          }
    </style>
</head>
<body>
    
    <nav>
      <div id="flex">
        <div class="left">
          <a href="">Google</a>
          <a href="">Youtube</a>
          <a href="">Linkedin</a>
          
        </div>
        <div class="right">
          <a href="">Acciojob</a>
        </div>
      </div>
    </nav>

    <div id="mainbox">
      <div class="box" id="flexgrow">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      
    </div>
</body>
</html>
