<!-- mediaquires.html -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            width: 100vw;
            margin: 0%;
            padding: 0%;
            /* display: flex;
            justify-content: center;
            align-items: center; */
        }
        *{
            box-sizing: border-box;
        }
        .continer{
            height: 100vh;
            width:100vw;
            
            display: grid;
           
            grid-template-columns: 1fr  ;
            
        }
        .box{
            /* height: 100px;
            width:100px; */
           
            border: 1px solid black;  
            padding: 20px;  
            display: flex;
            justify-content: center;
            align-items: center; 
             border-radius: 20px;
        }
        .box:hover{
            background-color:lightblue;
            cursor: pointer;
            box-shadow: 20px 20px 20px gray;
        }
        .input:focus{
            box-shadow: 10px 10px 5px rgb(151, 151, 232);
        }
        video{
            height: 40%;
            width: 100%;
            border: 1px solid black;
        }
        @media (min-width:1024px) {
            .continer{
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap:20px;
            }
        }
        
         @media (min-width:690px) and (max-width:1024px){
            .continer{
                grid-template-columns: 1fr 1fr;
            }
        } 

    </style>
 </head>
 <body>
    <div class="continer">

        <div class="box" >
          <input type="text"  class="input"></input>
        </div>
        <div class="box">
            <video  id="myVideo"src="https://www.w3schools.com/html/mov_bbb.mp4"controls loop type="video/mp4"></video>
        </div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        
        
        

    </div>
        <script>
           let video = document.getElementById("myVideo");

        video.addEventListener("click", function () {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });
    </script>
 </body>
 </html
