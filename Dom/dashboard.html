<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            width: 100vw;
        }

        .filters{
            display: flex;
            justify-content: space-between;
            padding: 10px;
        }
        #addRecord{
            height: 30px;
            width: 60px;
            cursor: pointer;
            background-color: rgb(126,126,213);
        }
        .modal{
            height: 100vh;
            width: 100vw;
            background-color: rgb(0, 0, 0,0.5);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
        }
        
        .form{
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 40vh;
            width: 40vw;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="filters">
        <input type="text" id="searchfilter">
        <button id = "addRecord">Add</button>
    </div>
    <table border="">
     <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>phone</th>
            <th>Action</th>
        </tr>
     </thead>
     <tbody id="tbody">

     </tbody>
    </table>
    <div class="modal">

        <button onclick="closeModal()">Close</button>
         
            <form class="form">
                <input type="text" placeholder="Name">
                <input type="text" placeholder="Email">
                <input type="text" placeholder="Phone">
                <input type="submit" value="Submit">
            </form>
         
    </div>
    <script>
        const students = [
            {id:1,  name:"Nitesh",email:"nitesh@gmail.com",phone:3992292818},
            {id:2,  name:"Mani",email:"nitesh@gmail.com",phone:3992292818},
            {id:3 , name:"Vishnu",email:"nitesh@gmail.com",phone:3992292818},
            {id:4,  name:"Siraj",email:"nitesh@gmail.com",phone:3992292818},
            {id:5,  name:"Siraj",email:"nitesh@gmail.com",phone:3992292818}
        ]
        
        const searchBar = document.getElementById("searchfilter")
        
        const addButton = document.getElementById("addRecord") 

        const modal = document.querySelector(".modal")

        const form = document.querySelector(".form")


        form.addEventListener("submit",(e)=>{
            e.preventDefault()
            console.log(e.target.children);

            const formData = e.target.children

            const name = formData[0].value.trim()
            const email = formData[1].value.trim()
            const phone =Number(formData[2].value.trim())

            const newStudent = {id: Math.floor(`${phone + Math.random()*500}`),name,email,phone}
             students.push(newStudent)

            renderFilterItems()

           e.target.reset()
             closeModal()
             console.log(newStudent);
        })

        addButton.addEventListener("click",(e)=>{
            modal.style.display = "flex"
        })
        function closeModal(){
            modal.style.display = "none"
        }

        searchBar.addEventListener("input",renderFilterItems)

        function renderFilterItems(){
         const text = searchBar.value
         const filterStudents = students.filter((student)=>{
             return  (
                student.name.toLocaleLowerCase().includes(text.toLocaleLowerCase()) ||
                student.email.toLocaleLowerCase().includes(text.toLocaleLowerCase())||
                student.phone.toString().includes(text)
         )  

         })
          addTableRows(filterStudents)
         console.log(filterStudents,`filterd students`);
        }
        const tbody = document.getElementById("tbody")

        function addTableRows(data=students){
            tbody.innerHTML = ``

          data.forEach((student)=>{
            const tr = document.createElement("tr")
            tr.dataset.id = student.id

            tr.innerHTML = `
            <td data-field = "name">${student.name}</td>
            <td data-field = "name">${student.email}</td>
            <td data-field = "name">${student.phone}</td>
            <td data-field = "name">
                 <button class="delete-btn">Delete</button>
                </td>
            `
              tbody.appendChild(tr)
           })
        }
      
        addTableRows()
    </script>
</body>
</html>
